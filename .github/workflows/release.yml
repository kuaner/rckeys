name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Prepare signing keychain
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${BUILD_CERTIFICATE_BASE64}" ] || [ -z "${P12_PASSWORD}" ] || [ -z "${KEYCHAIN_PASSWORD}" ]; then
            echo "::notice::未配置签名 secrets，本次构建使用 ad-hoc 签名（跳过公证）"
            exit 0
          fi
          KEYCHAIN_PATH="${RUNNER_TEMP}/build.keychain-db"
          CERT_PATH="${RUNNER_TEMP}/DeveloperID_Application.p12"
          echo "${BUILD_CERTIFICATE_BASE64}" | base64 --decode > "${CERT_PATH}"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security import "${CERT_PATH}" -k "${KEYCHAIN_PATH}" -P "${P12_PASSWORD}" \
            -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "${KEYCHAIN_PATH}" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security find-identity -v -p codesigning "${KEYCHAIN_PATH}"

      - name: Build, sign, notarize, package
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            export VERSION="${GITHUB_REF_NAME#v}"
          fi
          scripts/build_app.sh release

      - name: Clean temporary keychain
        if: always()
        run: |
          KEYCHAIN_PATH="${RUNNER_TEMP}/build.keychain-db"
          [ -f "${KEYCHAIN_PATH}" ] && security delete-keychain "${KEYCHAIN_PATH}" || true

      - uses: actions/upload-artifact@v4
        with:
          name: RCKeys-dmg
          path: dist/*.dmg
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          generate_release_notes: true
          body: |
            ## 安装

            1. 下载 DMG，双击挂载，将 **RCKeys** 拖入「应用程序」；
            2. 首次启动请在 系统设置 → 隐私与安全性 中授予 **输入监控** 与
               **辅助功能** 两项权限，然后重新打开 App；
            3. 启动即弹出设置窗口；关闭窗口 = 进入后台（无菜单栏/Dock 图标），
               之后用遥控器 **双击 TV** 或再次打开 App 唤出设置；
               退出请用设置窗口「服务 ⏷ → 清理映射并退出」。

            > 已内置 Sparkle 自动更新：日常自动检查，也可在「服务 ⏷ → 检查更新…」手动触发。

      - name: Generate and deploy Sparkle appcast
        if: startsWith(github.ref, 'refs/tags/')
        env:
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          DMG="dist/RCKeys-${VERSION}-universal.dmg"
          URL="https://github.com/kuaner/rckeys/releases/download/${TAG}/RCKeys-${VERSION}-universal.dmg"
          SIZE=$(stat -f%z "$DMG")

          SPARKLE_VERSION="2.9.1"
          curl -sL "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz" -o /tmp/sparkle.tar.xz
          mkdir -p /tmp/sparkle-dist
          tar xf /tmp/sparkle.tar.xz -C /tmp/sparkle-dist --strip-components=1
          SIGN_UPDATE="/tmp/sparkle-dist/bin/sign_update"
          chmod +x "$SIGN_UPDATE"

          SIG=$(echo "$SPARKLE_PRIVATE_ED_KEY" | "$SIGN_UPDATE" --ed-key-file - -p "$DMG")
          if [ -z "$SIG" ]; then
            echo "::warning::appcast 签名失败，跳过部署"
            exit 0
          fi
          echo "edSignature: ${SIG}"

          PUB_DATE=$(date -u +"%a, %d %b %Y %H:%M:%S +0000")
          cat > /tmp/appcast.xml <<APPLECAST
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle" xmlns:dc="http://purl.org/dc/elements/1.1/">
            <channel>
              <title>RCKeys</title>
              <link>https://kuaner.github.io/rckeys/appcast.xml</link>
              <description>RCKeys Updates</description>
              <language>zh-CN</language>
              <item>
                <title>RCKeys ${VERSION}</title>
                <pubDate>${PUB_DATE}</pubDate>
                <enclosure
                  url="${URL}"
                  sparkle:version="${VERSION}"
                  sparkle:shortVersionString="${VERSION}"
                  sparkle:edSignature="${SIG}"
                  length="${SIZE}"
                  type="application/octet-stream"
                />
                <sparkle:minimumSystemVersion>14.0</sparkle:minimumSystemVersion>
              </item>
            </channel>
          </rss>
          APPLECAST

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages || true
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf --quiet . || true
          fi
          cp /tmp/appcast.xml appcast.xml
          git add appcast.xml
          git commit -m "update appcast for ${TAG}" || true
          git push origin gh-pages
